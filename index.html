<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ブロックをならべてロボットのピコを動かす、Scratchの手前のプログラミングパズル。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>ピコのコード島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: 島のボード（左）とブロック作業台（右）。スマホでは縦に積む。Scratchの色分け（動き=青・制御=オレンジ・調べる=水色）をそのまま使い、移行時に色で対応がわかるようにする */
:root{
  --sea:#d6edf0; --sea-ln:#c3e2e6;
  --grass:#9ccd78; --grass-dk:#5e9c46; --leaf:#78b558;
  --sand:#f4e4b6; --sand-ln:#e6cf92;
  --paper:#fffdf6; --ink:#203238; --ink-soft:#56696f; --line:#d9e4e2;
  --motion:#4c97ff; --motion-dk:#3373cc;
  --control:#ffab19; --control-dk:#cf8b17;
  --sensing:#5cb1d6; --sensing-dk:#2e8eb8;
  --ok:#2f9e5b; --ng:#d9534f; --gold:#ffc933;
  --display:'Kiwi Maru','Hiragino Maru Gothic ProN','M PLUS Rounded 1c',sans-serif;
  --body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{
  background:var(--sea);
  background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,.55) 0 2px, transparent 3px),
                   radial-gradient(circle at 70% 60%, rgba(255,255,255,.4) 0 2px, transparent 3px);
  background-size:46px 46px, 63px 63px;
  color:var(--ink); font-family:var(--body); font-weight:500; font-size:16px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 32px;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--motion-dk); outline-offset:2px}

.top{max-width:1180px; margin:0 auto 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.brand{display:flex; align-items:center; gap:10px}
.brand svg{width:40px; height:40px; flex:none}
.brand h1{font-family:var(--display); font-weight:500; font-size:1.6rem; margin:0; letter-spacing:.04em}
.top-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.pill-btn{border:2px solid var(--ink); background:var(--paper); border-radius:999px; padding:6px 14px; font-weight:700; font-size:.92rem}
.pill-btn[aria-pressed="true"]{background:var(--ink); color:var(--paper)}

.wrap{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:18px; align-items:start}
.stage{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 8px)}
.ls{display:none}
@media (max-width:820px){
  .lf{display:none} .ls{display:inline}
  html{height:100%}
  body{height:100%; display:flex; flex-direction:column; padding-block:6px; overflow:hidden}
  .wrap{flex:1 1 auto; min-height:0; width:100%; align-items:stretch}
  .stage{position:static; overflow:auto}
  .bench{display:flex; flex-direction:column; min-height:0}
  .program{flex:1 1 auto; min-height:0 !important; max-height:none !important}
  .pb, .palette .blk{white-space:nowrap}
  .list{gap:2px}
  .top{margin-bottom:8px}
  .brand svg{width:30px; height:30px}
  .brand h1{font-size:1.15rem}
  .pill-btn{padding:3px 10px; font-size:.75rem}
  .wrap{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr); gap:8px}
  .panel{padding:8px; border-radius:12px; box-shadow:0 3px 0 var(--ink)}
  .chap{font-size:.62rem; padding:1px 5px}
  .lvl-head{gap:4px}
  .lvl-head h2{font-size:.95rem}
  .mission{font-size:.75rem; margin:2px 0 6px; line-height:1.4}
  .board{border-width:2px; border-radius:10px}
  .controls{gap:5px; margin-top:8px}
  .btn{flex:1 1 100%; padding:6px 6px; font-size:.82rem; border-radius:10px}
  .btn.go{min-width:0}
  .msg{font-size:.75rem; min-height:0; margin-top:8px; padding:6px}
  .bench h3{font-size:.85rem}
  .bench-row{margin-bottom:5px; gap:4px}
  .count{font-size:.7rem; padding:1px 6px}
  .small-btn{font-size:.7rem; padding:2px 6px; border-radius:8px}
  .palette{gap:5px; padding:6px; margin-bottom:8px}
  .blk{font-size:.72rem; padding:3px 6px; gap:3px; border-radius:6px; line-height:1.25}
  .blk .ico{font-size:.9rem}
  .sc{font-size:.6rem; padding:0 4px; margin-left:0}
  .program{padding:6px; max-height:62vh; min-height:140px}
  .empty-note{font-size:.72rem}
  .cblk .arm{border-left-width:10px; padding:4px 0 4px 4px; min-width:80px}
  .cblk .foot{width:64px; height:10px}
  .caret{width:80px; height:5px}
  .x{width:20px; height:20px; font-size:.72rem}
  .num button{width:20px; height:20px}
  .cond{font-size:.68rem; padding:0 6px; white-space:nowrap}
  .x{width:18px; height:18px; font-size:.68rem}
  .num button{width:18px; height:18px}
  .cblk .arm{padding:3px 0 3px 4px}
  .cblk .foot{height:8px}
  /* スマホ：上3/4にボード＋ブロック、下1/4に横幅いっぱいのプログラム */
  .wrap{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr) auto minmax(0,25vh);
    grid-template-rows:auto minmax(0,1fr) auto minmax(0,25dvh);
    grid-template-areas:"stage palh" "stage pal" "progh progh" "prog prog"; column-gap:8px; row-gap:5px}
  .bench{display:contents}
  .stage{grid-area:stage}
  .pal-h{grid-area:palh; margin:0}
  .palette{grid-area:pal; margin:0; align-content:flex-start; overflow:auto; background:var(--paper); border:2px solid var(--ink); border-radius:12px}
  .prog-h{grid-area:progh; margin:0}
  .program{grid-area:prog; background:var(--paper); border:2px solid var(--ink); border-radius:12px}
  #resetBtn, #speedBtn{font-size:.68rem; padding:4px 4px; font-weight:700}
  .slot{font-size:.68rem; padding:2px 6px}
}

.panel{background:var(--paper); border:2px solid var(--ink); border-radius:18px; padding:16px; min-width:0; box-shadow:0 4px 0 var(--ink)}
.lvl-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.chap{font-size:.8rem; font-weight:800; letter-spacing:.08em; background:var(--ink); color:var(--paper); border-radius:6px; padding:2px 8px}
.lvl-head h2{font-family:var(--display); font-weight:500; font-size:1.35rem; margin:0}
.mission{margin:4px 0 12px; color:var(--ink-soft); font-weight:700}

.board{position:relative; width:100%; max-width:520px; margin:0 auto; border-radius:14px; overflow:hidden; border:3px solid var(--grass-dk); background:var(--grass)}
.tiles{display:grid; width:100%; height:100%}
.tile{position:relative; aspect-ratio:1/1}
.tile.path{background:var(--sand); box-shadow:inset 0 0 0 1px var(--sand-ln)}
.tile.wall{background:var(--grass)}
.tile svg{position:absolute; inset:0; width:100%; height:100%}
.tile .start-pad{position:absolute; inset:22%; border-radius:50%; border:3px dashed var(--sand-ln)}
.item{position:absolute; display:grid; place-items:center; transition:transform .35s, opacity .35s; pointer-events:none}
.item svg{width:72%; height:72%}
.item.got{transform:scale(1.8) translateY(-30%); opacity:0}
.robot{position:absolute; transition:left var(--mv,.4s) ease-in-out, top var(--mv,.4s) ease-in-out; pointer-events:none; z-index:3}
.robot .spin{width:100%; height:100%; transition:transform var(--mv,.4s) ease-in-out; display:grid; place-items:center}
.robot .body{width:88%; height:88%}
.robot .body svg{width:100%; height:100%; display:block}
.robot.bump .body{animation:bump .45s}
@keyframes bump{30%{transform:translateY(-22%)} 60%{transform:translateY(4%)} 100%{transform:none}}
.robot.party .body{animation:party .6s 2}
@keyframes party{50%{transform:scale(1.25) rotate(20deg)}}

.controls{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px}
.btn{border:2px solid var(--ink); border-radius:12px; padding:10px 18px; font-weight:800; font-size:1.05rem; background:var(--paper); box-shadow:0 3px 0 var(--ink); transition:transform .08s}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--ink)}
.btn.go{background:var(--ok); color:#fff; min-width:140px}
.btn.stop{background:var(--ng); color:#fff}
.btn:disabled{opacity:.45; cursor:default}
.msg{min-height:3.2em; margin-top:12px; text-align:center; font-weight:700; padding:8px 10px; border-radius:12px; background:#f1f6f5; color:var(--ink-soft); text-wrap:balance}
.msg.ng{background:#fde8e6; color:#9d2f2b}
.msg.ok{background:#e3f5ea; color:#1f6c3e}

.bench h3{font-family:var(--display); font-weight:500; font-size:1.1rem; margin:0}
.bench-row{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap}
.palette{display:flex; flex-wrap:wrap; gap:8px; padding:10px; background:#f1f6f5; border-radius:12px; margin-bottom:16px}
.count{font-weight:800; font-variant-numeric:tabular-nums; font-size:.95rem; padding:2px 10px; border-radius:999px; background:#f1f6f5}
.count.full{background:#fde8e6; color:#9d2f2b}
.small-btn{border:2px solid var(--line); background:var(--paper); border-radius:10px; padding:4px 10px; font-weight:700; font-size:.85rem}

/* ブロック（Scratch風） */
.blk{display:inline-flex; align-items:center; gap:6px; color:#fff; font-weight:800; font-size:1rem; border-radius:8px; padding:8px 12px; border:2px solid rgba(0,0,0,.18); position:relative; text-align:left; line-height:1.3}
.blk.motion{background:var(--motion); border-color:var(--motion-dk)}
.blk.control{background:var(--control); border-color:var(--control-dk)}
.blk .ico{font-size:1.15rem}
.palette .blk{box-shadow:0 3px 0 rgba(0,0,0,.2)}
.palette .blk:active{transform:translateY(2px)}
.sc{display:none; font-size:.72rem; font-weight:700; opacity:.92; background:rgba(0,0,0,.18); border-radius:5px; padding:1px 6px; margin-left:4px; white-space:nowrap}
body.show-sc .sc{display:inline-block}

.program{min-height:180px; max-height:62vh; padding:12px; border-radius:12px; border:2px dashed var(--line); background:
  linear-gradient(var(--paper),var(--paper)) padding-box; overflow:auto; overscroll-behavior:contain}
.list{display:flex; flex-direction:column; align-items:flex-start; gap:4px}
.cblk{display:flex; flex-direction:column; align-items:flex-start}
.pb{cursor:pointer}
.pb.now{outline:4px solid var(--gold); outline-offset:1px}
.pb.check-ok{outline:4px solid var(--ok)}
.pb.check-ng{outline:4px solid var(--ng)}
.cblk > .head{border-bottom-left-radius:0}
.cblk .arm{border-left:16px solid var(--control); padding:6px 0 6px 8px; min-width:150px}
.cblk .foot{width:110px; height:16px; background:var(--control); border-radius:0 0 8px 8px; border:2px solid var(--control-dk); border-top:none}
.cblk .arm{border-left-color:var(--control)}
.x{border:none; background:rgba(0,0,0,.22); color:#fff; width:26px; height:26px; border-radius:50%; font-weight:800; font-size:.9rem; line-height:1; flex:none; margin-left:2px}
.num{display:inline-flex; align-items:center; gap:2px; background:#fff; color:var(--ink); border-radius:999px; padding:1px 3px}
.num button{border:none; background:#f1e2c6; width:24px; height:24px; border-radius:50%; font-weight:800; line-height:1}
.num b{min-width:1.4em; text-align:center; font-variant-numeric:tabular-nums}
.cond{border:none; background:var(--sensing); color:#fff; border:2px solid var(--sensing-dk); border-radius:999px; padding:2px 10px; font-weight:800; font-size:.92rem}
.caret{width:150px; height:6px; border-radius:3px; background:var(--gold); box-shadow:0 0 0 2px #fff, 0 0 10px var(--gold)}
.slot{border:2px dashed #c7d3d1; background:transparent; border-radius:8px; padding:4px 12px; color:var(--ink-soft); font-weight:700; font-size:.85rem}
.slot.active{border-color:var(--gold); background:#fff7d6; color:var(--ink)}
.empty-note{color:var(--ink-soft); font-weight:700; font-size:.9rem; margin:0 0 6px}

/* モーダル */
.veil{position:fixed; inset:0; background:rgba(32,50,56,.45); display:grid; place-items:center; z-index:50;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.card{background:var(--paper); border:3px solid var(--ink); border-radius:20px; padding:22px; width:min(560px,100%); max-height:100%; overflow:auto; box-shadow:0 6px 0 var(--ink)}
.card h2{font-family:var(--display); font-weight:500; font-size:1.5rem; margin:0 0 8px; text-wrap:balance}
.card p{margin:0 0 10px; max-width:60ch}
.card .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; margin-top:16px}
.stars{display:flex; gap:6px; justify-content:center; margin:6px 0 10px}
.stars svg{width:46px; height:46px}
.bridge{background:#f1f6f5; border-radius:14px; padding:14px; margin-top:12px}
.bridge h3{margin:0 0 8px; font-size:1rem}
.pair{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.pair .eq{font-weight:800; color:var(--ink-soft)}
.blk.sensing{background:var(--sensing); border-color:var(--sensing-dk)}
.mine{font-weight:700; font-size:.9rem}

.levels .chapter{margin-bottom:14px}
.levels h3{font-size:.95rem; margin:0 0 6px}
.lv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px}
.lv{border:2px solid var(--ink); border-radius:12px; background:var(--paper); padding:8px; text-align:left; font-weight:700; font-size:.85rem; line-height:1.35; display:flex; flex-direction:column; gap:2px}
.lv .n{font-size:1.2rem; font-weight:800}
.lv .st{color:#d79b00; letter-spacing:.1em; font-size:.85rem}
.lv.cur{background:#fff7d6}
.lv.locked{opacity:.4; border-style:dashed}
.parent{font-size:.88rem; color:var(--ink-soft); border-top:2px dashed var(--line); margin-top:10px; padding-top:10px}
.parent ol{padding-left:1.3em; margin:6px 0}
.linkish{border:none; background:none; text-decoration:underline; color:var(--ink-soft); font-weight:700; padding:0}

.ouchi-home{display:inline-flex;align-items:center;gap:4px;flex:none;padding:3px 10px 3px 8px;border:2px solid currentColor;border-radius:999px;font:700 12px/1.4 "M PLUS Rounded 1c",sans-serif;letter-spacing:.04em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;background:var(--paper)}
.ouchi-home:hover{color:var(--ink)}
.ouchi-home:focus-visible{outline:3px solid var(--motion-dk);outline-offset:2px}
.ouchi-home svg{width:15px;height:15px}
@media (max-width:820px){.ouchi-home{font-size:10px;padding:1px 7px 1px 5px}.ouchi-home svg{width:12px;height:12px}}
@media (prefers-reduced-motion:reduce){ .robot,.robot .spin,.item{transition:none} .robot.bump .body,.robot.party .body{animation:none} }
</style>

</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="12" width="6" height="16" rx="2" fill="#2f4550"/><rect x="30" y="12" width="6" height="16" rx="2" fill="#2f4550"/><circle cx="20" cy="21" r="13" fill="#ff7a59" stroke="#c9553a" stroke-width="2"/><path d="M20 3 L25.5 10.5 L14.5 10.5 Z" fill="#c9553a"/><circle cx="15.5" cy="16" r="3.2" fill="#fff"/><circle cx="24.5" cy="16" r="3.2" fill="#fff"/><circle cx="15.5" cy="15" r="1.6" fill="#203238"/><circle cx="24.5" cy="15" r="1.6" fill="#203238"/></svg>
    <h1>ピコのコード島</h1>
  </div>
  <div class="top-actions">
    <a class="ouchi-home" href="https://ouchi-lab.vercel.app/" aria-label="おうちラボへもどる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>おうちラボ</a>
    <button class="pill-btn" id="scBtn" aria-pressed="false">Scratchの ことば</button>
    <button class="pill-btn" id="lvBtn">レベル えらび</button>
  </div>
</header>

<main class="wrap">
  <section class="panel stage">
    <div class="lvl-head"><span class="chap" id="chap">1しょう</span><h2 id="lvTitle"></h2></div>
    <p class="mission" id="mission"></p>
    <div class="board" id="board"></div>
    <div class="controls">
      <button class="btn go" id="runBtn">▶ スタート</button>
      <button class="btn" id="resetBtn">↺ はじめに もどす</button>
      <button class="btn" id="speedBtn">はやさ: ふつう</button>
    </div>
    <div class="msg" id="msg">ブロックを ならべて「スタート」を おしてね。</div>
  </section>

  <section class="panel bench">
    <div class="bench-row pal-h"><h3>ブロック</h3><button class="small-btn" id="hintBtn">ヒント</button></div>
    <div class="palette" id="palette"></div>
    <div class="bench-row prog-h">
      <h3>プログラム</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="count" id="count">0 こ</span>
        <button class="small-btn" id="clearBtn">ぜんぶ けす</button>
      </div>
    </div>
    <div class="program" id="program"></div>
  </section>
</main>

<div class="veil" id="veil" hidden><div class="card" id="card"></div></div>

<script>
(function(){
const DR=[-1,0,1,0], DC=[0,1,0,-1];
const SVG={
  star:'<svg viewBox="0 0 40 40"><path d="M20 3l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L20 29.6 9.6 35.1l2-11.6-8.5-8.2 11.7-1.7z" fill="#ffc933" stroke="#d79b00" stroke-width="2" stroke-linejoin="round"/></svg>',
  starOff:'<svg viewBox="0 0 40 40"><path d="M20 3l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L20 29.6 9.6 35.1l2-11.6-8.5-8.2 11.7-1.7z" fill="#e7ecea" stroke="#c7d3d1" stroke-width="2" stroke-linejoin="round"/></svg>',
  flower:'<svg viewBox="0 0 40 40"><g fill="#ff8fb1" stroke="#e0628c" stroke-width="1.5"><circle cx="20" cy="9" r="7"/><circle cx="31" cy="17" r="7"/><circle cx="27" cy="30" r="7"/><circle cx="13" cy="30" r="7"/><circle cx="9" cy="17" r="7"/></g><circle cx="20" cy="21" r="6" fill="#ffd34d" stroke="#e0a400" stroke-width="1.5"/></svg>',
  tree:'<svg viewBox="0 0 40 40"><circle cx="21" cy="23" r="13" fill="#4f8a3a"/><circle cx="20" cy="21" r="12" fill="#68a84c"/><circle cx="16" cy="17" r="6" fill="#86c066"/></svg>',
  bush:'<svg viewBox="0 0 40 40"><g fill="#7fbb5d"><path d="M9 26c2-5 4-5 5 0M17 30c2-5 4-5 5 0M27 22c2-5 4-5 5 0" stroke="#5e9c46" stroke-width="2" fill="none" stroke-linecap="round"/></g></svg>',
  robot:'<svg viewBox="0 0 40 40"><rect x="4" y="12" width="6" height="16" rx="2" fill="#2f4550"/><rect x="30" y="12" width="6" height="16" rx="2" fill="#2f4550"/><circle cx="20" cy="21" r="13" fill="#ff7a59" stroke="#c9553a" stroke-width="2"/><path d="M20 2.5 L25.5 10.5 L14.5 10.5 Z" fill="#c9553a"/><circle cx="15.5" cy="16" r="3.2" fill="#fff"/><circle cx="24.5" cy="16" r="3.2" fill="#fff"/><circle cx="15.5" cy="15" r="1.6" fill="#203238"/><circle cx="24.5" cy="15" r="1.6" fill="#203238"/><path d="M15 25 Q20 29 25 25" stroke="#c9553a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'
};
const BLOCKS={
  fwd:  {cls:'motion', ico:'↑', label:'まえへ すすむ', short:'すすむ', sc:'○歩動かす'},
  right:{cls:'motion', ico:'↻', label:'みぎを むく', short:'みぎ',  sc:'↻ 90度回す'},
  left: {cls:'motion', ico:'↺', label:'ひだりを むく', short:'ひだり', sc:'↺ 90度回す'},
  rep:  {cls:'control', label:'くりかえす', short:'くりかえし', sc:'○回繰り返す', box:true},
  if:   {cls:'control', label:'もしも', short:'もし', sc:'もし◇なら', box:true},

// ---------- 保存 ----------
const KEY='pico-code-island-v1';
let save={stars:{}, seen:{}, unlockAll:false, sc:false, cur:0};
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) save=Object.assign(save,s);}catch(e){}
function persist(){ try{localStorage.setItem(KEY, JSON.stringify(save));}catch(e){} }

// ---------- 状態 ----------
let L, cur=Math.min(save.cur||0, LEVELS.length-1), grid, S, prog=[], target, running=false, stopFlag=false, fast=false;
let robotEl, itemEls={}, blockEls=new Map(), angle=0;
const $=id=>document.getElementById(id);
const el=(tag,cls,html)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;};

function unlocked(i){ return save.unlockAll || i===0 || !!save.stars[i-1] || !!save.stars[i]; }

function loadLevel(i){
  stopFlag=true; running=false;
  cur=i; L=LEVELS[i]; save.cur=i; persist();
  grid=L.map.map(r=>r.split(''));
  prog=[]; target={arr:prog, idx:0};
  $('chap').textContent=L.ch+'しょう '+CHAPTERS[L.ch];
  $('lvTitle').textContent='レベル '+(i+1)+'  '+L.name;
  $('mission').textContent=L.goal;
  buildBoard(); resetState(); renderPalette(); renderProgram();
  say('ブロックを ならべて「スタート」を おしてね。');
  setRunning(false);
  if(L.intro && !save.seen[i]){ showIntro(); save.seen[i]=1; persist(); }
}

function buildBoard(){
  const b=$('board'); b.innerHTML='';
  const rows=grid.length, cols=grid[0].length;
  const tiles=el('div','tiles'); tiles.style.gridTemplateColumns='repeat('+cols+',1fr)';
  itemEls={};
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const ch=grid[r][c], t=el('div','tile '+(ch==='#'?'wall':'path'));
    if(ch==='#'){ const h=(r*7+c*13)%5; t.innerHTML = h<3?SVG.tree:(h===3?SVG.bush:''); }
    if(ch==='S') t.appendChild(el('div','start-pad'));
    tiles.appendChild(t);
    if(ch==='*'||ch==='G'){
      const it=el('div','item', ch==='*'?SVG.star:SVG.flower);
      place(it,r,c); b.appendChild(it); itemEls[r+','+c]=it;
    }
  }
  b.prepend(tiles);
  robotEl=el('div','robot','<div class="spin"><div class="body">'+SVG.robot+'</div></div>');
  b.appendChild(robotEl);
}
function place(e,r,c){
  const rows=grid.length, cols=grid[0].length;
  e.style.left=(c/cols*100)+'%'; e.style.top=(r/rows*100)+'%';
  e.style.width=(100/cols)+'%'; e.style.height=(100/rows)+'%';
}
function resetState(){
  let sr=0,sc=0,total=0;
  grid.forEach((row,r)=>row.forEach((ch,c)=>{ if(ch==='S'){sr=r;sc=c;} if(ch==='*') total++; }));
  S={r:sr,c:sc,d:L.dir,got:new Set(),total};
  Object.entries(itemEls).forEach(([k,e])=>e.classList.remove('got'));
  robotEl.style.setProperty('--mv','0s'); robotEl.querySelector('.spin').style.setProperty('--mv','0s');
  angle=L.dir*90; place(robotEl,S.r,S.c); robotEl.querySelector('.spin').style.transform='rotate('+angle+'deg)';
  robotEl.classList.remove('bump','party');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ robotEl.style.removeProperty('--mv'); }));
  clearHighlights();
}
const walk=(r,c)=> grid[r] && grid[r][c] && grid[r][c]!=='#';
const atGoal=()=> grid[S.r][S.c]==='G';
const won=()=> atGoal() && S.got.size===S.total;
function cond(k){
  if(k==='wall') return !walk(S.r+DR[S.d], S.c+DC[S.d]);
  if(k==='left'){ const d=(S.d+3)%4; return walk(S.r+DR[d], S.c+DC[d]); }
  if(k==='right'){ const d=(S.d+1)%4; return walk(S.r+DR[d], S.c+DC[d]); }
  return false;
}

// ---------- パレット ----------
function blockInner(t){
  const B=BLOCKS[t];
  return (B.ico?'<span class="ico">'+B.ico+'</span>':'')+lab(B.label+(t==='rep'?' ○かい':'')+(t==='if'?' ◇ なら':''), B.short)+'<span class="sc">'+B.sc+'</span>';
}
function renderPalette(){
  const p=$('palette'); p.innerHTML='';
  L.blocks.forEach(t=>{
    const b=el('button','blk '+BLOCKS[t].cls, blockInner(t));
    b.onclick=()=>addBlock(t);
    p.appendChild(b);
  });
}
function countBlocks(list){ return list.reduce((n,b)=>n+1+(b.body?countBlocks(b.body):0),0); }
function addBlock(t){
  if(running) return;
  if(L.limit && countBlocks(prog)>=L.limit){ say('この レベルは ブロック '+L.limit+'こ まで だよ。いらない ブロックを × で けしてね。','ng'); return; }
  const nb={t};
  if(t==='rep'){ nb.n=3; nb.body=[]; }
  if(t==='if'){ nb.c=(L.conds||['wall'])[0]; nb.body=[]; }
  if(t==='until'){ nb.body=[]; }
  target.arr.splice(target.idx,0,nb); target.idx++;
  if(nb.body) target={arr:nb.body, idx:0};
  renderProgram(); resetIfDirty();
}
function contains(b,arr){ return !!b.body && (b.body===arr || b.body.some(x=>contains(x,arr))); }

// ---------- プログラム表示 ----------
function renderProgram(){
  const root=$('program'); root.innerHTML=''; blockEls=new Map();
  if(!prog.length) root.appendChild(el('p','empty-note','うえの ブロックを タップすると ここに ならぶよ'));
  root.appendChild(renderList(prog,true));
  const n=countBlocks(prog), c=$('count');
  c.textContent= L.limit ? ('ブロック '+n+' / '+L.limit) : ('ブロック '+n+' こ');
  c.classList.toggle('full', !!L.limit && n>=L.limit);
}
function renderList(arr,isRoot){
  const w=el('div','list');
  arr.forEach((b,i)=>{
    if(target.arr===arr && target.idx===i) w.appendChild(el('div','caret'));
    w.appendChild(renderBlock(b,arr,i));
  });
  const slot=el('button','slot'+(target.arr===arr&&target.idx===arr.length?' active':''), isRoot?'＋ ここに つける':'＋ この なかに いれる');
  slot.onclick=()=>{ if(running) return; target={arr,idx:arr.length}; renderProgram(); };
  w.appendChild(slot);
  return w;
}
function renderBlock(b,arr,i){
  const B=BLOCKS[b.t];
  const head=el('div','blk pb '+B.cls+(B.box?' head':''));
  if(b.t==='rep'){
    head.innerHTML=lab('くりかえす','');
    const num=el('span','num'); const minus=el('button','','−'), plus=el('button','','＋'), v=el('b','',b.n);
    minus.setAttribute('aria-label','へらす'); plus.setAttribute('aria-label','ふやす');
    minus.onclick=e=>{e.stopPropagation(); if(running) return; b.n=Math.max(2,b.n-1); v.textContent=b.n; resetIfDirty();};
    plus.onclick=e=>{e.stopPropagation(); if(running) return; b.n=Math.min(12,b.n+1); v.textContent=b.n; resetIfDirty();};
    num.append(minus,v,plus); head.append(num, el('span','','かい'));
  } else if(b.t==='if'){
    head.innerHTML=lab('もしも','もし');
    const cb=el('button','cond',condLab(b.c));
    cb.onclick=e=>{e.stopPropagation(); if(running) return; const opts=L.conds||['wall']; b.c=opts[(opts.indexOf(b.c)+1)%opts.length]; cb.innerHTML=condLab(b.c); resetIfDirty();};
    head.append(cb, el('span','',lab('なら','')));
  } else {
    head.innerHTML=(B.ico?'<span class="ico">'+B.ico+'</span>':'')+lab(B.label,B.short);
  }
  head.appendChild(el('span','sc',B.sc));
  const x=el('button','x','×'); x.setAttribute('aria-label','けす');
  x.onclick=e=>{ e.stopPropagation(); if(running) return;
    if(contains(b,target.arr)) target={arr,idx:i};
    else if(target.arr===arr && target.idx>i) target.idx--;
    arr.splice(i,1); renderProgram(); resetIfDirty(); };
  head.appendChild(x);
  head.onclick=()=>{ if(running) return; target={arr,idx:i+1}; renderProgram(); };
  blockEls.set(b,head);
  if(!B.box) return head;
  const box=el('div','cblk'); box.appendChild(head);
  const arm=el('div','arm'); arm.appendChild(renderList(b.body,false)); box.appendChild(arm);
  box.appendChild(el('div','foot'));
  return box;
}

// ---------- 実行 ----------
function* exec(list){
  for(const b of list){
    if(b.t==='rep'){ for(let k=0;k<b.n;k++){ yield {b,a:'loop'}; yield* exec(b.body); } }
    else if(b.t==='if'){ const r=cond(b.c); yield {b,a:'check',r}; if(r) yield* exec(b.body); }
    else if(b.t==='until'){ while(!atGoal()){ yield {b,a:'loop'}; yield* exec(b.body); } }
    else yield {b,a:b.t};
  }
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let dirty=false;
function resetIfDirty(){ if(dirty){ resetState(); dirty=false; } }
function clearHighlights(){ document.querySelectorAll('.pb.now,.pb.check-ok,.pb.check-ng').forEach(e=>e.classList.remove('now','check-ok','check-ng')); }
function hl(b,cls){ clearHighlights(); const e=blockEls.get(b); if(e){ e.classList.add(cls);
  const box=$('program'), er=e.getBoundingClientRect(), br=box.getBoundingClientRect();
  if(er.top<br.top || er.bottom>br.bottom) box.scrollTo({top: box.scrollTop + (er.top-br.top) - br.height/3, behavior:'smooth'}); } }

async function run(){
  if(running){ stopFlag=true; return; }
  if(!prog.length){ say('まず ブロックを ならべてね。','ng'); return; }
  resetState(); dirty=true; await wait(60);
  running=true; stopFlag=false; setRunning(true); say('ピコが うごいているよ…');
  const D=fast?230:560;
  robotEl.style.setProperty('--mv',(D*0.8/1000)+'s');
  let steps=0, result=null;
  for(const st of exec(prog)){
    if(stopFlag){ result='stop'; break; }
    if(++steps>400){ result='loop'; break; }
    if(st.a==='loop'){ hl(st.b,'now'); await wait(D*0.35); continue; }
    if(st.a==='check'){ hl(st.b, st.r?'check-ok':'check-ng'); await wait(D*0.6); continue; }
    hl(st.b,'now');
    if(st.a==='fwd'){
      const nr=S.r+DR[S.d], nc=S.c+DC[S.d];
      if(!walk(nr,nc)){ robotEl.classList.remove('bump'); void robotEl.offsetWidth; robotEl.classList.add('bump'); await wait(500); result='wall'; break; }
      S.r=nr; S.c=nc; place(robotEl,nr,nc);
      await wait(D*0.75);
      const k=nr+','+nc;
      if(grid[nr][nc]==='*' && !S.got.has(k)){ S.got.add(k); itemEls[k].classList.add('got'); }
      if(won()){ result='win'; break; }
      await wait(D*0.25);
    } else {
      S.d = st.a==='right' ? (S.d+1)%4 : (S.d+3)%4;
      angle += st.a==='right'?90:-90;
      robotEl.querySelector('.spin').style.setProperty('--mv',(D*0.8/1000)+'s');
      robotEl.querySelector('.spin').style.transform='rotate('+angle+'deg)';
      await wait(D);
    }
  }
  if(!result) result = won()?'win':(atGoal()?'stars':'short');
  running=false; setRunning(false); clearHighlights();
  finish(result);
}
function finish(r){
  if(r==='win'){
    robotEl.classList.add('party');
    const n=countBlocks(prog), st= n<=L.best?3:(n<=L.best+3?2:1);
    save.stars[cur]=Math.max(save.stars[cur]||0,st); persist();
    say('やったね！ クリア！','ok');
    setTimeout(()=>showWin(st,n),700);
    return;
  }
  const M={
    wall:'ゴツン！ まえが きで すすめないよ。どこで まがるか みなおそう。',
    stars:'はなに ついたけど、ほしが まだ のこってるよ。',
    short:'プログラムが おわったけど、はなに とどかなかったよ。',
    loop:'ずっと くりかえして おわらないよ。くりかえしの なかみを みなおそう。',
    stop:'とめたよ。'
  };
  say(M[r], r==='stop'?'':'ng');
}
function setRunning(on){
  const b=$('runBtn'); b.textContent=on?'■ とめる':'▶ スタート'; b.classList.toggle('stop',on); b.classList.toggle('go',!on);
  ['clearBtn','hintBtn','lvBtn'].forEach(id=>$(id).disabled=on);
  document.querySelectorAll('#palette .blk').forEach(x=>x.disabled=on);
}
function say(t,kind){ const m=$('msg'); m.textContent=t; m.className='msg'+(kind?' '+kind:''); }

// ---------- モーダル ----------
function modal(html, wire){ $('card').innerHTML=html; $('veil').hidden=false; wire&&wire($('card')); const f=$('card').querySelector('button'); f&&f.focus(); }
function close(){ $('veil').hidden=true; }
$('veil').addEventListener('click',e=>{ if(e.target.id==='veil') close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });

function showIntro(){
  const I=L.intro; if(!I){ return; }
  const prev=cur?LEVELS[cur-1].blocks:[];
  let nw=L.blocks.filter(t=>!prev.includes(t)); if(!nw.length) nw=L.ch===2?['rep']:['if'];
  const demo=nw.map(t=>'<span class="blk '+BLOCKS[t].cls+'">'+blockInner(t)+'</span>').join(' ');
  modal('<h2>'+I.title+'</h2>'+I.body.map(p=>'<p>'+p+'</p>').join('')+'<div class="pair">'+demo+'</div><div class="row"><button class="btn go" id="ok">やってみる</button></div>',
    c=>c.querySelector('#ok').onclick=close);
}
function bridgeHtml(B){
  return '<div class="bridge"><h3>Scratchでは こう かくよ</h3>'+B.items.map(([k,sc,mine])=>
    '<div class="pair"><span class="blk '+k+'">'+sc+'</span><span class="eq">＝</span><span class="mine">'+mine+'</span></div>').join('')+'<p style="margin:6px 0 0">'+B.note+'</p></div>';
}
function showWin(st,n){
  const starRow='<div class="stars">'+[1,2,3].map(i=>i<=st?SVG.star:SVG.starOff).join('')+'</div>';
  const tip = st<3 ? '<p>ブロック '+n+'こ で クリア。'+L.best+'こ で できたら ほし みっつ！</p>' : '<p>ブロック '+n+'こ。かんぺき！</p>';
  const last=cur===LEVELS.length-1;
  modal('<h2>レベル '+(cur+1)+' クリア！</h2>'+starRow+tip+(L.bridge?bridgeHtml(L.bridge):'')+
    '<div class="row"><button class="btn" id="again">もういちど</button>'+(last?'<button class="btn go" id="lv">レベル えらびへ</button>':'<button class="btn go" id="next">つぎの レベルへ</button>')+'</div>',
    c=>{ c.querySelector('#again').onclick=()=>{close(); resetState(); dirty=false; say('プログラムは そのまま。もっと すくない ブロックで できるかな？');};
         const nx=c.querySelector('#next'); if(nx) nx.onclick=()=>{close(); loadLevel(cur+1);};
         const lv=c.querySelector('#lv'); if(lv) lv.onclick=()=>{close(); showLevels();}; });
}
function showLevels(){
  let h='<h2>レベル えらび</h2><div class="levels">';
  [1,2,3].forEach(ch=>{
    h+='<div class="chapter"><h3>'+ch+'しょう '+CHAPTERS[ch]+'</h3><div class="lv-grid">';
    LEVELS.forEach((lv,i)=>{ if(lv.ch!==ch) return;
      const s=save.stars[i]||0, lock=!unlocked(i);
      h+='<button class="lv'+(i===cur?' cur':'')+(lock?' locked':'')+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span>'+lv.name+'</span><span class="st">'+(s?'★'.repeat(s)+'☆'.repeat(3-s):(lock?'まだ':'—'))+'</span></button>';
    });
    h+='</div></div>';
  });
  h+='</div><div class="parent"><b>おうちの かたへ</b><ol>'+
    '<li>1しょう：命令を順番に並べる（逐次処理）。向きは「ピコから見て」右・左なので、視点の切り替えが最初の壁です。</li>'+
    '<li>2しょう：繰り返し。ブロック数の上限で「まとめる」発想を引き出します。8は二重ループ。</li>'+
    '<li>3しょう：条件分岐と条件付きループ。ルールを作ってロボット自身に判断させる段階です。</li>'+
    '<li>全部クリアしたら、Scratchでスプライトを矢印キーで動かす作品から始めるとスムーズです。「Scratchの ことば」ボタンで対応する名前を表示できます。</li></ol>'+
    '<button class="linkish" id="unl">'+(save.unlockAll?'レベルの ロックを もとに もどす':'ぜんぶの レベルを ひらく')+'</button></div>'+
    '<div class="row"><button class="btn" id="cl">とじる</button></div>';
  modal(h,c=>{
    c.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(!unlocked(i)){ b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:240}); return;} close(); loadLevel(i); });
    c.querySelector('#unl').onclick=()=>{ save.unlockAll=!save.unlockAll; persist(); showLevels(); };
    c.querySelector('#cl').onclick=close;
  });
}

// ---------- ボタン ----------
$('runBtn').onclick=run;
$('resetBtn').onclick=()=>{ if(running){ stopFlag=true; } setTimeout(()=>{ resetState(); dirty=false; say('はじめの ばしょに もどったよ。'); },running?50:0); };
$('speedBtn').onclick=()=>{ fast=!fast; $('speedBtn').textContent='はやさ: '+(fast?'はやい':'ふつう'); };
$('clearBtn').onclick=()=>{ if(running) return; prog.length=0; target={arr:prog,idx:0}; renderProgram(); resetState(); dirty=false; say('プログラムを ぜんぶ けしたよ。'); };
$('hintBtn').onclick=()=>{
  modal('<h2>ヒント</h2><p>'+L.hint+'</p>'+(L.intro?'<p><button class="linkish" id="again">せつめいを もういちど みる</button></p>':'')+'<div class="row"><button class="btn go" id="ok">わかった</button></div>',
    c=>{ c.querySelector('#ok').onclick=close; const a=c.querySelector('#again'); if(a) a.onclick=showIntro; });
};
$('lvBtn').onclick=showLevels;
function applySc(){ document.body.classList.toggle('show-sc',!!save.sc); $('scBtn').setAttribute('aria-pressed',save.sc?'true':'false'); }
$('scBtn').onclick=()=>{ save.sc=!save.sc; persist(); applySc(); };
applySc();
loadLevel(cur);
})();
</script>

</body>
